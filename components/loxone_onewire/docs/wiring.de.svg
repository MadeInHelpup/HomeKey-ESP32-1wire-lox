<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <title id="t">HomeKey-ESP32 → Loxone 1-Wire-Bridge: Verdrahtung</title>
  <desc id="d">Verdrahtung eines ESP32 mit PN532-Reader und Loxone 1-Wire Extension: GPIO27 an DATA mit 4,7-kΩ-Pull-up nach 3,3 V, gemeinsame Masse.</desc>

  <rect width="860" height="630" rx="12" fill="#1a1a2e"/>
  <text x="430" y="36" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">HomeKey-ESP32 → Loxone 1-Wire-Bridge: Verdrahtung</text>

  <!-- ESP32 -->
  <rect x="30" y="60" width="220" height="350" rx="10" fill="#16213e" stroke="#4a9eff" stroke-width="2"/>
  <text x="140" y="84" text-anchor="middle" fill="#4a9eff" font-size="13" font-weight="bold">ESP32 (z. B. NodeMCU)</text>
  <g font-size="12">
    <text x="46" y="115" fill="#ffd700">3V3</text>
    <text x="46" y="143" fill="#ff6b6b">GND</text>
    <text x="46" y="171" fill="#50fa7b">GPIO27 (1-Wire, OD)</text>
    <text x="46" y="199" fill="#c8a0ff">GPIO5  (PN532 SS)</text>
    <text x="46" y="227" fill="#c8a0ff">GPIO18 (PN532 SCK)</text>
    <text x="46" y="255" fill="#c8a0ff">GPIO19 (PN532 MISO)</text>
    <text x="46" y="283" fill="#c8a0ff">GPIO23 (PN532 MOSI)</text>
    <text x="46" y="355" fill="#ffd700">5V / VIN</text>
    <text x="46" y="383" fill="#ff6b6b">GND</text>
  </g>
  <circle cx="250" cy="111" r="5" fill="#ffd700"/>
  <circle cx="250" cy="139" r="5" fill="#ff6b6b"/>
  <circle cx="250" cy="167" r="5" fill="#50fa7b"/>
  <circle cx="250" cy="195" r="5" fill="#c8a0ff"/>
  <circle cx="250" cy="223" r="5" fill="#c8a0ff"/>
  <circle cx="250" cy="251" r="5" fill="#c8a0ff"/>
  <circle cx="250" cy="279" r="5" fill="#c8a0ff"/>
  <circle cx="250" cy="351" r="5" fill="#ffd700"/>
  <circle cx="250" cy="379" r="5" fill="#ff6b6b"/>

  <!-- 1-Wire data line -->
  <line x1="250" y1="167" x2="560" y2="167" stroke="#50fa7b" stroke-width="2.5"/>
  <text x="552" y="159" text-anchor="end" fill="#50fa7b" font-size="11">1-Wire-Bus (DATA)</text>

  <!-- 3V3 rail and pull-up resistor between 3V3 and DATA -->
  <line x1="250" y1="111" x2="400" y2="111" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="111" x2="400" y2="124" stroke="#ffd700" stroke-width="1.5"/>
  <rect x="392" y="124" width="16" height="30" rx="2" fill="#2a2a4a" stroke="#ffd700" stroke-width="1.5"/>
  <line x1="400" y1="154" x2="400" y2="167" stroke="#ffd700" stroke-width="1.5"/>
  <circle cx="400" cy="111" r="3.5" fill="#ffd700"/>
  <circle cx="400" cy="167" r="3.5" fill="#ffd700"/>
  <text x="384" y="136" text-anchor="end" fill="#ffd700" font-size="11" font-weight="bold">Pull-up-Widerstand</text>
  <text x="384" y="152" text-anchor="end" fill="#ffd700" font-size="11">4,7 kΩ</text>

  <!-- Loxone 1-Wire Extension -->
  <rect x="560" y="80" width="260" height="200" rx="10" fill="#16213e" stroke="#50fa7b" stroke-width="2"/>
  <text x="690" y="106" text-anchor="middle" fill="#50fa7b" font-size="13" font-weight="bold">Loxone 1-Wire Extension</text>
  <text x="580" y="140" fill="#888" font-size="11">Bus-Spannung (intern)</text>
  <text x="580" y="171" fill="#50fa7b" font-size="12">DATA (1-Wire)</text>
  <text x="580" y="199" fill="#ff6b6b" font-size="12">GND</text>
  <text x="580" y="243" fill="#888" font-size="11">Die Extension liefert die</text>
  <text x="580" y="259" fill="#888" font-size="11">Busspannung (3,3 V bis 5 V)</text>
  <circle cx="560" cy="167" r="5" fill="#50fa7b"/>
  <circle cx="560" cy="195" r="5" fill="#ff6b6b"/>

  <!-- Common ground: ESP32 GND to Loxone GND -->
  <path d="M 250 379 L 530 379 L 530 195 L 560 195" stroke="#ff6b6b" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <text x="390" y="397" text-anchor="middle" fill="#ff6b6b" font-size="11">gemeinsame Masse</text>

  <!-- Power supply -->
  <rect x="560" y="310" width="260" height="96" rx="8" fill="#2a2a4a" stroke="#ffd700" stroke-width="1.5"/>
  <text x="690" y="333" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">Stromversorgung</text>
  <text x="690" y="353" text-anchor="middle" fill="#e0e0e0" font-size="11">5 V dediziert am Verbauort</text>
  <text x="690" y="371" text-anchor="middle" fill="#e0e0e0" font-size="11">an VIN oder USB-Buchse</text>
  <text x="690" y="391" text-anchor="middle" fill="#888" font-size="10">PN532 hängt an den 5 V des Boards</text>
  <line x1="560" y1="351" x2="250" y2="351" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- PN532 -->
  <line x1="140" y1="410" x2="140" y2="446" stroke="#c8a0ff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="150" y="432" fill="#c8a0ff" font-size="11">SPI</text>
  <rect x="30" y="446" width="350" height="66" rx="8" fill="#16213e" stroke="#c8a0ff" stroke-width="1.5"/>
  <text x="205" y="468" text-anchor="middle" fill="#c8a0ff" font-size="12" font-weight="bold">PN532 NFC-Reader</text>
  <text x="205" y="486" text-anchor="middle" fill="#aaa" font-size="10">SCK→GPIO18 | MISO→GPIO19 | MOSI→GPIO23</text>
  <text x="205" y="500" text-anchor="middle" fill="#aaa" font-size="10">SS→GPIO5 | VCC→5V | GND→GND</text>

  <!-- Notes -->
  <rect x="30" y="534" width="800" height="80" rx="8" fill="#12122a" stroke="#444" stroke-width="1"/>
  <text x="46" y="555" fill="#e0e0e0" font-size="12" font-weight="bold">Hinweise</text>
  <text x="46" y="574" fill="#aaa" font-size="11">• GPIO27 wird als Open-Drain betrieben (automatisch durch die Firmware)</text>
  <text x="46" y="590" fill="#aaa" font-size="11">• Der externe 4,7-kΩ-Pull-up von DATA nach 3,3 V ist zwingend erforderlich</text>
  <text x="46" y="606" fill="#aaa" font-size="11">• GPIO34 bis GPIO39 nicht verwenden (nur Eingang, kein Open-Drain möglich)</text>
</svg>
