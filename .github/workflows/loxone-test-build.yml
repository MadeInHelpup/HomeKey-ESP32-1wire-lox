# Test build of the Loxone 1-Wire bridge for the classic ESP32.
#
# Builds the OTA firmware, the factory image and the web UI image with
# CONFIG_LOXONE_ONEWIRE=y and publishes them as the "loxone-test" pre-release.
# Only runs for this feature branch; not meant to be part of an upstream PR.
name: Loxone test build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/loxone-onewire-bridge

concurrency:
  group: loxone-test-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  littlefs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: 'data'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install LittleFS Tool
        run: pip install littlefs-python
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: data
      - name: Build
        run: bun run build
        working-directory: data
      - name: Remove extra, only keep compressed
        run: find dist -regex ".*\.\(html\|css\|br\|js\|json.gz\)" -delete
        working-directory: data
      - name: Create LittleFS Image
        run: littlefs-python create $(pwd)/dist littlefs.bin -v --fs-size=0x20000 --name-max=64 --block-size=4096
        working-directory: data
      - name: Archive build directory
        uses: actions/upload-artifact@v7
        with:
          name: ui-build-directory
          path: data/dist
          retention-days: 1
      - name: Archive LittleFS image
        uses: actions/upload-artifact@v7
        with:
          name: littlefs-binary
          path: data/littlefs.bin

  firmware:
    runs-on: ubuntu-latest
    needs: littlefs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: 'recursive'
      - name: Get UI Build Directory
        uses: actions/download-artifact@v8
        with:
          name: ui-build-directory
          path: data/dist
      - uses: actions/cache@v5
        with:
          path: |
            $HOME/.ccache
            managed_components
            build-loxone
          key: ${{ runner.os }}-esp32-loxone-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp32-loxone-
      - name: Fix directory permissions for Docker
        run: |
          mkdir -p build-loxone managed_components $HOME/.ccache
          sudo chown -R 1000:1000 build-loxone managed_components $HOME/.ccache
      - name: ESP-IDF Build (esp32, Loxone bridge)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          path: '.'
          extra_docker_args: >-
            -v ${{ github.workspace }}/build-loxone:/project/build-loxone
            -v ${{ github.workspace }}/managed_components:/project/managed_components
            -v $HOME/.ccache:/root/.ccache
            -e CCACHE_DIR=/root/.ccache
          command: CI=true idf.py --ccache -DSDKCONFIG="sdkconfig.loxone" -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.loxone" -B build-loxone merge-bin
      - name: Fix ownership post-build
        run: sudo chown -R $USER:$USER build-loxone/ managed_components/ $HOME/.ccache
      - name: Show size and bridge config
        run: |
          grep -E "^CONFIG_LOXONE" sdkconfig.loxone
          ls -l build-loxone/HomeKey-ESP32.bin build-loxone/merged-binary.bin
      - name: Organize binaries
        run: |
          mkdir -p out
          cp build-loxone/HomeKey-ESP32.bin out/esp32-loxone.firmware.ota.bin
          cp build-loxone/merged-binary.bin out/esp32-loxone.firmware.factory.bin
      - name: Archive firmware
        uses: actions/upload-artifact@v7
        with:
          name: esp32-loxone-firmware
          path: out/

  publish:
    runs-on: ubuntu-latest
    needs: [littlefs, firmware]
    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l artifacts
          gh release delete loxone-test --cleanup-tag --yes || true
          gh release create loxone-test \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Loxone 1-Wire test build" \
            --notes "Test build of ${{ github.ref_name }} @ ${{ github.sha }} for the classic ESP32. OTA: upload esp32-loxone.firmware.ota.bin and littlefs.bin on the OTA page of the web UI. Factory image only for USB flashing, it erases settings and pairing." \
            artifacts/esp32-loxone.firmware.ota.bin \
            artifacts/esp32-loxone.firmware.factory.bin \
            artifacts/littlefs.bin
